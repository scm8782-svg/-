<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude 사용량</title>
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --track: #e1e0d9;
    --border: rgba(11, 11, 11, 0.10);
    --good: #0ca30c;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
    --accent: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --track: #2c2c2a;
      --border: rgba(255, 255, 255, 0.10);
      --accent: #3987e5;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.45;
    padding: max(12px, env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 460px; margin: 0 auto; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 2px 14px;
  }
  header h1 { font-size: 18px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 8px; }
  header h1 svg { flex: none; }
  #updated { color: var(--muted); font-size: 12.5px; }
  #refresh-btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
    border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px;
    display: flex; align-items: center; gap: 6px; cursor: pointer;
  }
  #refresh-btn:active { opacity: .6; }
  #refresh-btn.spinning svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .banner {
    border-radius: 12px; padding: 10px 14px; margin: 0 0 12px; font-size: 13.5px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
    display: none;
  }
  .banner.show { display: block; }
  .banner strong { color: var(--ink); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px 18px;
    margin-bottom: 12px;
  }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .card-title { font-size: 14px; font-weight: 600; color: var(--ink-2); margin: 0; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12.5px; font-weight: 600; color: var(--ink-2);
    white-space: nowrap;
  }
  .chip svg { flex: none; }

  .value-row { display: flex; align-items: baseline; gap: 6px; margin: 6px 0 10px; }
  .value { font-size: 38px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .value .unit { font-size: 20px; font-weight: 600; color: var(--ink-2); }
  .remain { font-size: 13px; color: var(--muted); margin-left: auto; text-align: right; }

  .meter { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .meter > i {
    display: block; height: 100%; border-radius: 4px;
    background: var(--accent); width: 0%;
    transition: width .5s ease;
    min-width: 0;
  }
  .meter > i.nonzero { min-width: 8px; }

  .reset-line { margin-top: 10px; font-size: 13px; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; }
  .reset-line .abs { color: var(--muted); }

  .extra-note { font-size: 13px; color: var(--ink-2); margin-top: 6px; }

  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }
  .notify-card { font-size: 13.5px; color: var(--ink-2); }
  .notify-card h2 { font-size: 14px; font-weight: 600; color: var(--ink-2); margin: 0 0 8px; }
  .notify-card button {
    border: 1px solid var(--border); background: var(--page); color: var(--ink);
    border-radius: 10px; padding: 8px 14px; font: inherit; font-size: 13.5px; cursor: pointer;
  }
  .notify-card button:active { opacity: .6; }
  .notify-card textarea {
    width: 100%; height: 72px; margin-top: 8px; font-size: 11px; color: var(--muted);
    background: var(--page); border: 1px solid var(--border); border-radius: 8px; padding: 6px;
    resize: none;
  }
  .notify-card ol { margin: 8px 0 0; padding-left: 20px; }
  .notify-card ol li { margin-bottom: 4px; }
  .notify-card .ok { color: var(--good); font-weight: 600; }
  .notify-card a { color: var(--accent); }
  #empty {
    display: none; text-align: left; color: var(--ink-2); font-size: 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px;
  }
  #empty.show { display: block; }
  #empty code { background: var(--track); border-radius: 4px; padding: 1px 5px; font-size: 12.5px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 17a8 8 0 1 1 16 0" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M12 17 15.5 10" stroke="var(--ink)" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="12" cy="17" r="1.7" fill="var(--ink)"/>
      </svg>
      Claude 사용량
      <span id="plan" style="font-size:12px;font-weight:600;color:var(--muted)"></span>
    </h1>
    <button id="refresh-btn" type="button" aria-label="새로고침">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span id="updated">-</span>
    </button>
  </header>

  <div id="stale" class="banner"><strong>⚠️ 데이터가 오래됐어요.</strong> <span id="stale-msg"></span></div>
  <div id="offline" class="banner">📴 오프라인이에요. 마지막으로 받아둔 데이터를 보여줍니다.</div>

  <div id="cards"></div>

  <div id="empty">
    <strong>아직 사용량 데이터가 없어요.</strong><br><br>
    GitHub Actions 워크플로가 아직 실행되지 않았거나 실패했을 수 있어요.<br>
    저장소의 <code>Actions</code> 탭에서 <code>Claude 사용량 갱신</code> 워크플로를 수동 실행해 보세요.
    자세한 설정 방법은 저장소의 README를 참고하세요.
  </div>

  <section id="notify-card" class="card notify-card" hidden>
    <h2>🔔 한도 임박 알림</h2>
    <div id="notify-body"></div>
  </section>

  <section id="token-card" class="card notify-card">
    <h2>⚡ 즉시 갱신</h2>
    <div id="token-body"></div>
  </section>

  <footer>비공식 사용량 API 기준 · 자동 갱신 약 30분 간격</footer>
</main>

<script>
"use strict";
// ── 상태 판정: 아이콘 + 라벨을 항상 함께 표시(색만으로 의미 전달 금지) ──
const STATUS = [
  { max: 50,  key: "good",     label: "여유",       color: "var(--good)",
    icon: '<circle cx="8" cy="8" r="6.5" fill="COLOR"/><path d="M5 8.2 7.2 10.4 11 5.8" stroke="var(--surface)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' },
  { max: 80,  key: "warning",  label: "주의",       color: "var(--warning)",
    icon: '<path d="M8 1.5 15 14H1z" fill="COLOR"/><rect x="7.2" y="6" width="1.6" height="4" rx="0.8" fill="var(--surface)"/><circle cx="8" cy="12" r="0.9" fill="var(--surface)"/>' },
  { max: 95,  key: "serious",  label: "한도 임박",  color: "var(--serious)",
    icon: '<circle cx="8" cy="8" r="6.5" fill="COLOR"/><rect x="7.2" y="4" width="1.6" height="5" rx="0.8" fill="var(--surface)"/><circle cx="8" cy="11.4" r="0.9" fill="var(--surface)"/>' },
  { max: 1e9, key: "critical", label: "거의 소진",  color: "var(--critical)",
    icon: '<path d="M5 1.5h6L15 5v6l-4 3.5H5L1 11V5z" fill="COLOR"/><path d="M5.6 5.6l4.8 4.8M10.4 5.6l-4.8 4.8" stroke="var(--surface)" stroke-width="1.6" stroke-linecap="round"/>' },
];
const statusOf = (pct) => STATUS.find((s) => pct < s.max) ?? STATUS[STATUS.length - 1];

// 표시할 사용량 창(window) 정의 - 알 수 없는 키는 아래에서 자동 처리
const KNOWN = [
  { key: "five_hour",        title: "5시간 세션",       resetVerb: "세션 초기화" },
  { key: "seven_day",        title: "주간 · 전체 모델", resetVerb: "주간 초기화" },
  { key: "seven_day_opus",   title: "주간 · Opus",      resetVerb: "주간 초기화" },
  { key: "seven_day_sonnet", title: "주간 · Sonnet",    resetVerb: "주간 초기화" },
];
const SKIP_KEYS = new Set(["extra_usage", ...KNOWN.map((w) => w.key)]);

const $ = (id) => document.getElementById(id);
const fmtTime = new Intl.DateTimeFormat("ko-KR", { hour: "numeric", minute: "2-digit" });
const fmtDay  = new Intl.DateTimeFormat("ko-KR", { month: "numeric", day: "numeric", weekday: "short", hour: "numeric", minute: "2-digit" });

function relRemain(iso, now) {
  const t = Date.parse(iso);
  if (!Number.isFinite(t)) return null;
  let s = Math.max(0, Math.round((t - now) / 1000));
  const d = Math.floor(s / 86400); s -= d * 86400;
  const h = Math.floor(s / 3600);  s -= h * 3600;
  const m = Math.ceil(s / 60);
  if (d > 0) return `${d}일 ${h}시간 후`;
  if (h > 0) return `${h}시간 ${m}분 후`;
  if (m > 0) return `${m}분 후`;
  return "곧";
}
function absReset(iso, now) {
  const t = Date.parse(iso);
  if (!Number.isFinite(t)) return "";
  return (t - now < 22 * 3600 * 1000 ? fmtTime : fmtDay).format(t);
}
function agoText(iso, now) {
  const t = Date.parse(iso);
  if (!Number.isFinite(t)) return "-";
  const m = Math.round((now - t) / 60000);
  if (m < 1) return "방금 갱신";
  if (m < 60) return `${m}분 전 갱신`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}시간 전 갱신`;
  return `${Math.floor(h / 24)}일 전 갱신`;
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function windowCard(title, w, resetVerb, now) {
  if (!w || typeof w.utilization !== "number") return "";
  const pct = Math.max(0, Math.min(100, w.utilization));
  const st = statusOf(pct);
  const remain = w.resets_at ? relRemain(w.resets_at, now) : null;
  return `
  <section class="card">
    <div class="card-head">
      <h2 class="card-title">${esc(title)}</h2>
      <span class="chip"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">${st.icon.replaceAll("COLOR", st.color)}</svg>${st.label}</span>
    </div>
    <div class="value-row">
      <span class="value">${pct % 1 ? pct.toFixed(1) : pct}<span class="unit">%</span></span>
      <span class="remain">남은 한도 ${(100 - pct) % 1 ? (100 - pct).toFixed(1) : 100 - pct}%</span>
    </div>
    <div class="meter" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="${esc(title)} 사용량">
      <i class="${pct > 0 ? "nonzero" : ""}" style="width:${pct}%;background:${st.color}"></i>
    </div>
    ${w.resets_at ? `<div class="reset-line"><span>${remain ? `${esc(remain)} ${esc(resetVerb)}` : esc(resetVerb)}</span><span class="abs">${esc(absReset(w.resets_at, now))}</span></div>` : ""}
  </section>`;
}

function extraCard(x) {
  if (!x || !x.is_enabled) return "";
  const used = typeof x.used_credits === "number" ? x.used_credits : null;
  const limit = typeof x.monthly_limit === "number" ? x.monthly_limit : null;
  const pct = typeof x.utilization === "number" ? Math.max(0, Math.min(100, x.utilization)) : null;
  const st = statusOf(pct ?? 0);
  const money = (v) => `$${(v / 100).toFixed(2)}`; // used_credits 는 센트 단위로 알려져 있음
  return `
  <section class="card">
    <div class="card-head">
      <h2 class="card-title">추가 사용량 (Extra usage)</h2>
      ${pct != null ? `<span class="chip"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">${st.icon.replaceAll("COLOR", st.color)}</svg>${st.label}</span>` : ""}
    </div>
    ${pct != null ? `
    <div class="value-row"><span class="value">${pct % 1 ? pct.toFixed(1) : pct}<span class="unit">%</span></span></div>
    <div class="meter" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="추가 사용량">
      <i class="${pct > 0 ? "nonzero" : ""}" style="width:${pct}%;background:${st.color}"></i>
    </div>` : ""}
    ${used != null && limit != null ? `<p class="extra-note">이번 달 ${money(used)} / ${money(limit)} 사용</p>`
      : used != null ? `<p class="extra-note">이번 달 ${money(used)} 사용</p>`
      : `<p class="extra-note">추가 사용량이 활성화되어 있어요.</p>`}
  </section>`;
}

let last = null;          // 마지막으로 성공한 usage.json
let statusLocked = false; // 갱신 진행 문구를 표시하는 동안 render() 가 덮지 않도록

// ── 즉시 갱신 (새로고침 버튼이 실제로 Actions 를 실행) ──────────
// 토큰은 이 폰의 localStorage 에만 저장된다. 저장소나 페이지에는 포함되지 않는다.
const GH_TOKEN_KEY = "gh-token";
const WORKER_URL_KEY = "worker-url";
const WORKER_KEY_KEY = "worker-key";
const ls = (k) => { try { return localStorage.getItem(k) || ""; } catch { return ""; } };
const ghToken = () => ls(GH_TOKEN_KEY);
const workerCfg = () => {
  const url = ls(WORKER_URL_KEY), key = ls(WORKER_KEY_KEY);
  return url && key ? { url: url.replace(/\/+$/, ""), key } : null;
};

/** Worker 를 통해 사용량을 직접 조회한다(1~2초). 성공하면 last 를 갱신. */
async function loadViaWorker() {
  const w = workerCfg();
  if (!w) return false;
  const res = await fetch(`${w.url}/?k=${encodeURIComponent(w.key)}&t=${Date.now()}`, { cache: "no-store" });
  if (res.status === 401) throw new Error("APP_KEY 가 맞지 않아요");
  if (!res.ok) throw new Error(`Worker 오류 (HTTP ${res.status})`);
  const body = await res.json();
  if (!body.data) throw new Error(body.error || "Worker 가 데이터를 주지 않았어요");
  last = body;
  try { localStorage.setItem("usage-cache", JSON.stringify(last)); } catch {}
  return true;
}

function render() {
  const now = Date.now();
  if (!last) { $("empty").classList.add("show"); return; }
  $("empty").classList.remove("show");

  const d = last.data ?? {};
  let html = "";
  for (const w of KNOWN) html += windowCard(w.title, d[w.key], w.resetVerb, now);
  // 새로 생긴(모르는) 창도 형태가 맞으면 그대로 표시
  for (const [k, v] of Object.entries(d)) {
    if (!SKIP_KEYS.has(k) && v && typeof v === "object" && typeof v.utilization === "number") {
      html += windowCard(k.replaceAll("_", " "), v, "초기화", now);
    }
  }
  html += extraCard(d.extra_usage);
  $("cards").innerHTML = html;

  if (!statusLocked) $("updated").textContent = agoText(last.fetched_at, now);
  const ageMin = (now - Date.parse(last.fetched_at)) / 60000;
  const stale = Number.isFinite(ageMin) && ageMin > 90;
  $("stale").classList.toggle("show", stale);
  if (stale) $("stale-msg").textContent = `마지막 갱신이 ${Math.round(ageMin)}분 전이에요. GitHub Actions 실행 상태를 확인해 보세요.`;
}

async function load(manual = false) {
  const btn = $("refresh-btn");
  if (manual) btn.classList.add("spinning");
  // Worker 가 설정돼 있으면 항상 최신값을 직접 가져온다.
  if (typeof workerCfg === "function" && workerCfg()) {
    try {
      await loadViaWorker();
      $("offline").classList.remove("show");
      if (manual) btn.classList.remove("spinning");
      render();
      return;
    } catch { /* 실패하면 아래의 usage.json 경로로 폴백 */ }
  }
  try {
    const res = await fetch(`usage.json?t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    last = await res.json();
    try { localStorage.setItem("usage-cache", JSON.stringify(last)); } catch {}
    $("offline").classList.remove("show");
  } catch {
    if (!last) { // 네트워크 실패 시 로컬 캐시 폴백
      try { last = JSON.parse(localStorage.getItem("usage-cache")); } catch {}
    }
    $("offline").classList.toggle("show", !navigator.onLine || !!last);
  } finally {
    if (manual) btn.classList.remove("spinning");
  }
  render();
}

$("refresh-btn").addEventListener("click", onRefreshClick);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
setInterval(() => load(), 60_000);      // 1분마다 새 데이터 확인
setInterval(render, 30_000);            // 카운트다운/상대시간 갱신
load(true);

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}


// GitHub Pages 주소(계정.github.io/저장소/)에서 owner/repo 를 유도
function repoInfo() {
  const m = location.hostname.match(/^([^.]+)\.github\.io$/);
  const repo = location.pathname.split("/").filter(Boolean)[0];
  return m && repo ? { owner: m[1], repo: decodeURIComponent(repo) } : null;
}

function ghErrText(status) {
  if (status === 401) return "토큰이 유효하지 않아요";
  if (status === 403) return "토큰 권한 부족 (Actions 쓰기 필요)";
  if (status === 404) return "저장소/워크플로를 못 찾음";
  return `갱신 실패 (HTTP ${status})`;
}

async function ghFetch(path, opts = {}) {
  const r = repoInfo();
  if (!r) throw new Error("저장소 주소를 알 수 없어요");
  return fetch(`https://api.github.com/repos/${r.owner}/${r.repo}${path}`, {
    ...opts,
    headers: {
      Authorization: `Bearer ${ghToken()}`,
      Accept: "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
      ...(opts.headers || {}),
    },
  });
}

let defaultBranch = null;

/** 워크플로를 실행시키고 usage.json 이 새로 갱신될 때까지 기다린다. */
async function triggerRefresh(onStatus) {
  if (!defaultBranch) {
    const res = await ghFetch("");
    if (!res.ok) throw new Error(ghErrText(res.status));
    defaultBranch = (await res.json()).default_branch;
  }
  const before = last?.fetched_at ?? null;

  const res = await ghFetch("/actions/workflows/usage.yml/dispatches", {
    method: "POST",
    body: JSON.stringify({ ref: defaultBranch }),
  });
  if (!res.ok) throw new Error(ghErrText(res.status));

  // 워크플로 실행 + Pages 배포까지 보통 30~60초
  for (let i = 1; i <= 30; i++) {
    await new Promise((r) => setTimeout(r, 5000));
    onStatus(`갱신 중… ${i * 5}초`);
    await load();
    if (last?.fetched_at && last.fetched_at !== before) return true;
  }
  return false;
}

async function onRefreshClick() {
  const btn = $("refresh-btn");
  if (btn.dataset.busy === "1") return;
  if (workerCfg()) {                        // Worker 가 있으면 직접 조회 (가장 빠름)
    btn.dataset.busy = "1";
    btn.classList.add("spinning");
    statusLocked = true;
    $("updated").textContent = "조회 중…";
    try {
      await loadViaWorker();
      statusLocked = false;
      render();
    } catch (e) {
      $("updated").textContent = e.message || "조회 실패";
      setTimeout(() => { statusLocked = false; render(); }, 4000);
    } finally {
      btn.classList.remove("spinning");
      btn.dataset.busy = "0";
    }
    return;
  }
  if (!ghToken()) { load(true); return; }   // 토큰이 없으면 기존처럼 파일만 다시 읽기

  btn.dataset.busy = "1";
  btn.classList.add("spinning");
  statusLocked = true;
  const setStatus = (t) => { $("updated").textContent = t; };
  setStatus("갱신 요청 중…");
  try {
    if (!(await triggerRefresh(setStatus))) setStatus("아직 반영 전 - 잠시 후 확인");
    else setStatus("방금 갱신됨");
  } catch (e) {
    setStatus(e.message || "갱신 실패");
  } finally {
    btn.classList.remove("spinning");
    btn.dataset.busy = "0";
    // 잠시 결과 문구를 보여준 뒤 평소 표시로 복귀
    setTimeout(() => { statusLocked = false; render(); }, 4000);
  }
}

function renderToken() {
  const body = $("token-body");
  const w = workerCfg();

  // 1) Worker 가 설정된 상태 - 가장 빠른 경로
  if (w) {
    body.innerHTML = `
      <span class="ok">⚡ Worker 연결됨</span> - 새로고침이 1~2초면 끝납니다.<br>
      <span style="color:var(--muted);font-size:12px">${esc(w.url)}</span><br><br>
      <button id="btn-w-test">연결 테스트</button>
      <button id="btn-w-clear">연결 해제</button>`;
    $("btn-w-test").onclick = async () => {
      const b = $("btn-w-test");
      b.textContent = "확인 중…";
      try { await loadViaWorker(); render(); b.textContent = "✅ 정상"; }
      catch (e) { b.textContent = "❌ " + (e.message || "실패"); }
    };
    $("btn-w-clear").onclick = () => {
      try { localStorage.removeItem(WORKER_URL_KEY); localStorage.removeItem(WORKER_KEY_KEY); } catch {}
      renderToken();
    };
    return;
  }

  // 2) Worker 미설정 - 설정 안내 (+ 기존 GitHub 토큰 방식도 유지)
  const usingGh = !!ghToken();
  body.innerHTML = `
    Cloudflare Worker 를 연결하면 새로고침이 <strong>1~2초</strong>로 끝나고,
    5분마다 자동 갱신도 안정적으로 돕니다.
    <ol>
      <li>저장소의 <code>worker/README.md</code> 순서대로 Worker 를 만드세요 (약 10분)</li>
      <li>완성된 주소와 APP_KEY 를 아래에 입력</li>
    </ol>
    <input id="w-url" placeholder="https://claude-usage.계정.workers.dev"
      style="width:100%;margin-top:6px;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--page);color:var(--ink);font:inherit;font-size:13px">
    <input id="w-key" placeholder="APP_KEY"
      style="width:100%;margin-top:6px;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--page);color:var(--ink);font:inherit;font-size:13px">
    <div style="margin-top:8px"><button id="btn-w-save">연결하고 확인</button></div>
    <p id="w-msg" style="color:var(--muted);font-size:12px;margin:8px 0 0">
      입력한 값은 이 폰에만 저장됩니다.
      ${usingGh ? "현재는 GitHub 토큰 방식(20~60초)으로 동작 중이에요." : ""}</p>`;
  $("btn-w-save").onclick = async () => {
    const url = $("w-url").value.trim(), key = $("w-key").value.trim();
    const msg = $("w-msg");
    if (!url || !key) { msg.textContent = "주소와 APP_KEY 를 모두 입력해 주세요."; return; }
    msg.textContent = "연결 확인 중…";
    try { localStorage.setItem(WORKER_URL_KEY, url); localStorage.setItem(WORKER_KEY_KEY, key); } catch {}
    try {
      await loadViaWorker();
      render();
      renderToken();
    } catch (e) {
      try { localStorage.removeItem(WORKER_URL_KEY); localStorage.removeItem(WORKER_KEY_KEY); } catch {}
      msg.textContent = "❌ " + (e.message || "연결 실패") + " - 주소와 APP_KEY 를 확인해 주세요.";
    }
  };
}
renderToken();

// ── 한도 임박 푸시 알림 설정 ──────────────────────────────────
const VAPID_PUBLIC_KEY = "BFnWFPeCWL9oQ3X2FAOlq2qsBbH3qQWyoJSQDZ4lF2jngb8TUJ9EusYIV50TfDoj0eRuyGOmUjSMhOW_1dNDlFU";

// GitHub Pages 주소에서 저장소 Secret 페이지 주소를 유도
function secretPageUrl() {
  const r = repoInfo();
  return r ? `https://github.com/${r.owner}/${r.repo}/settings/secrets/actions` : null;
}

function b64ToU8(s) {
  const pad = "=".repeat((4 - (s.length % 4)) % 4);
  const raw = atob((s + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
}

const pushSupported = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

async function renderNotify(showSetup = false) {
  if (!pushSupported) return;
  const card = $("notify-card");
  const body = $("notify-body");
  card.hidden = false;

  if (Notification.permission === "denied") {
    body.innerHTML = `알림 권한이 차단되어 있어요.<br>브라우저 설정 → 사이트 설정 → 알림에서 이 사이트를 허용해 주세요.`;
    return;
  }

  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  const registered = localStorage.getItem("push-registered") === "1";
  const secretUrl = secretPageUrl();

  if (!sub) {
    body.innerHTML = `
      사용량이 <strong>70% · 90%</strong>를 넘으면 폰으로 알림을 보내드려요.<br><br>
      <button id="btn-sub">알림 켜기</button>`;
    $("btn-sub").onclick = async () => {
      try {
        if ((await Notification.requestPermission()) !== "granted") { renderNotify(); return; }
        await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(VAPID_PUBLIC_KEY) });
        localStorage.removeItem("push-registered");
        renderNotify(true);
      } catch { body.innerHTML = "구독에 실패했어요. 잠시 후 다시 시도해 주세요."; }
    };
    return;
  }

  if (registered && !showSetup) {
    body.innerHTML = `
      <span class="ok">✅ 알림이 켜져 있어요</span> (70%·90% 도달 시 발송)<br><br>
      <button id="btn-local">🔔 이 기기에서 알림 미리보기</button>
      <button id="btn-show">구독 정보 다시 보기</button>
      <button id="btn-unsub">알림 끄기</button>`;
    $("btn-local").onclick = async () => {
      // 서버를 거치지 않고 폰에서 직접 알림 표시 → 표시 설정 자체를 점검
      try {
        await reg.showNotification("🔔 미리보기 알림", {
          body: "이 알림이 보이면 폰의 알림 표시 설정은 정상이에요.",
          tag: "local-test",
          icon: "icon.svg",
        });
        $("btn-local").textContent = "✅ 표시 요청함 - 상태표시줄 확인";
      } catch (e) {
        $("btn-local").textContent = "❌ 실패: " + (e.message || e);
      }
    };
    $("btn-show").onclick = () => renderNotify(true);
    $("btn-unsub").onclick = async () => {
      await (await reg.pushManager.getSubscription())?.unsubscribe();
      localStorage.removeItem("push-registered");
      renderNotify();
    };
    return;
  }

  // 구독은 됐고, 서버(GitHub Secret) 등록 안내가 필요한 상태
  const json = JSON.stringify(sub.toJSON());
  body.innerHTML = `
    마지막 한 단계! 아래 <strong>구독 정보</strong>를 GitHub에 등록해야 알림이 발송돼요.
    <ol>
      <li><button id="btn-copy">📋 구독 정보 복사</button></li>
      <li>${secretUrl ? `<a href="${secretUrl}/new" target="_blank" rel="noopener">Secret 등록 페이지 열기</a>` : "저장소 Settings → Secrets → Actions"}</li>
      <li>Name: <code>PUSH_SUBSCRIPTION</code> / Secret: 붙여넣기 → Add secret</li>
      <li><button id="btn-done">등록 완료했어요</button></li>
    </ol>
    <textarea readonly id="sub-json">${json.replace(/</g, "&lt;")}</textarea>`;
  $("btn-copy").onclick = async () => {
    try { await navigator.clipboard.writeText(json); $("btn-copy").textContent = "✅ 복사됨"; }
    catch { $("sub-json").select(); document.execCommand("copy"); $("btn-copy").textContent = "✅ 복사됨"; }
  };
  $("btn-done").onclick = () => { localStorage.setItem("push-registered", "1"); renderNotify(); };
}
renderNotify();
</script>
