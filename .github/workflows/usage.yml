name: Claude 사용량 갱신

# 자동 실행 중단됨 (2026-09-01).
# 사용량 조회에는 user:profile 스코프의 세션 토큰이 필요한데, 이 토큰은
# 8시간마다 만료되고 갱신 통로가 자주 차단되어 무인 운영이 불가능했다.
# 장기 토큰(setup-token)은 스코프가 없어 403. 수동 실행은 여전히 가능하다.
on:
  workflow_dispatch:
    inputs:
      test_alert:
        description: "테스트 푸시 알림 보내기"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: usage-refresh
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 이전 실행에서 갱신(rotate)된 토큰 상태를 가져온다.
      # 시크릿에서 파생한 키로 암호화되어 있어 캐시가 유출돼도 내용은 읽을 수 없다.
      - name: 토큰 상태 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: state.enc
          key: token-state-${{ github.run_id }}
          restore-keys: |
            token-state-

      - name: 토큰 상태 복호화
        env:
          CLAUDE_CREDENTIALS: ${{ secrets.CLAUDE_CREDENTIALS }}
        run: |
          if [ -f state.enc ]; then
            export ENC_KEY="$(printf %s "$CLAUDE_CREDENTIALS" | sha256sum | awk '{print $1}')"
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ENC_KEY -in state.enc -out state.json \
              || { echo "이전 토큰 상태를 복호화하지 못해 무시합니다(시크릿이 바뀌었을 수 있음)."; rm -f state.json; }
          fi

      # 조회가 실패해도(예: Anthropic 429) 앱 배포는 계속되어야 한다.
      - name: 사용량 조회
        id: fetch
        continue-on-error: true
        env:
          CLAUDE_CREDENTIALS: ${{ secrets.CLAUDE_CREDENTIALS }}
          STATE_FILE: state.json
          OUT: _site/usage.json
        run: node scripts/fetch-usage.mjs

      # 조회 실패 시 현재 배포돼 있는 usage.json 을 그대로 유지한다.
      - name: 조회 실패 시 기존 데이터 유지
        if: ${{ steps.fetch.outcome == 'failure' }}
        run: |
          mkdir -p _site
          OWNER="${GITHUB_REPOSITORY%%/*}"; NAME="${GITHUB_REPOSITORY#*/}"
          URL="https://${OWNER}.github.io/${NAME}/usage.json"
          echo "사용량 조회 실패 - 기존 데이터를 유지합니다: $URL"
          if curl -fsSL --max-time 30 "$URL" -o _site/usage.json; then
            echo "기존 usage.json 을 가져왔습니다."
          else
            echo "기존 데이터도 없습니다. usage.json 없이 배포합니다."
          fi

      - name: 사이트 구성
        run: cp -r app/. _site/

      # ── 한도 임박 푸시 알림 (PUSH_SUBSCRIPTION 시크릿이 있을 때만 동작) ──
      - name: 알림 상태 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: notify-state.json
          key: notify-state-${{ github.run_id }}
          restore-keys: |
            notify-state-

      - name: web-push 설치 캐시
        uses: actions/cache@v4
        with:
          path: node_modules
          key: webpush-3.6.7

      - name: 한도 임박 알림 발송
        env:
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          USAGE_FILE: _site/usage.json
          NOTIFY_STATE_FILE: notify-state.json
          TEST_ALERT: ${{ inputs.test_alert && 'true' || '' }}
        run: |
          if [ ! -f "$USAGE_FILE" ]; then
            echo "usage.json 이 없어 알림을 건너뜁니다."
          elif [ -n "$PUSH_SUBSCRIPTION" ]; then
            [ -d node_modules/web-push ] || npm install --no-save --no-audit --no-fund web-push@3.6.7
            node scripts/send-alerts.mjs
          else
            echo "PUSH_SUBSCRIPTION 미설정 - 알림 건너뜀"
          fi

      - name: 알림 상태 캐시 저장
        if: ${{ hashFiles('notify-state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: notify-state.json
          key: notify-state-${{ github.run_id }}

      - name: 토큰 상태 암호화 및 캐시 저장 준비
        env:
          CLAUDE_CREDENTIALS: ${{ secrets.CLAUDE_CREDENTIALS }}
        run: |
          rm -f state.enc
          if [ -f state.json ]; then
            export ENC_KEY="$(printf %s "$CLAUDE_CREDENTIALS" | sha256sum | awk '{print $1}')"
            openssl enc -aes-256-cbc -pbkdf2 -pass env:ENC_KEY -in state.json -out state.enc
            rm -f state.json
          fi

      - name: 토큰 상태 캐시 저장
        if: ${{ hashFiles('state.enc') != '' }}
        uses: actions/cache/save@v4
        with:
          path: state.enc
          key: token-state-${{ github.run_id }}

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4

      # 앱은 배포하되, 데이터를 못 가져왔다면 실행을 실패로 남긴다.
      # (초록불로 가려지면 토큰 만료 같은 문제를 며칠씩 모르고 지나간다)
      - name: 조회 실패 시 실행을 실패로 표시
        if: ${{ steps.fetch.outcome == 'failure' }}
        run: |
          echo "::error::사용량 조회 실패 - 앱은 배포됐지만 데이터는 예전 것입니다."
          echo "토큰이 만료됐을 수 있습니다. CLAUDE_CREDENTIALS 시크릿을 새 값으로 교체해 보세요."
          exit 1
