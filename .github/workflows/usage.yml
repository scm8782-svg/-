name: Claude 사용량 갱신

on:
  schedule:
    # 30분 간격 (정시 혼잡을 피해 7분/37분에 실행). GitHub 사정으로 몇 분씩 늦을 수 있음.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: usage-refresh
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 이전 실행에서 갱신(rotate)된 토큰 상태를 가져온다.
      # 시크릿에서 파생한 키로 암호화되어 있어 캐시가 유출돼도 내용은 읽을 수 없다.
      - name: 토큰 상태 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: state.enc
          key: token-state-${{ github.run_id }}
          restore-keys: |
            token-state-

      - name: 토큰 상태 복호화
        env:
          CLAUDE_CREDENTIALS: ${{ secrets.CLAUDE_CREDENTIALS }}
        run: |
          if [ -f state.enc ]; then
            export ENC_KEY="$(printf %s "$CLAUDE_CREDENTIALS" | sha256sum | awk '{print $1}')"
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ENC_KEY -in state.enc -out state.json \
              || { echo "이전 토큰 상태를 복호화하지 못해 무시합니다(시크릿이 바뀌었을 수 있음)."; rm -f state.json; }
          fi

      - name: 사용량 조회
        env:
          CLAUDE_CREDENTIALS: ${{ secrets.CLAUDE_CREDENTIALS }}
          STATE_FILE: state.json
          OUT: _site/usage.json
        run: node scripts/fetch-usage.mjs

      - name: 사이트 구성
        run: cp -r app/. _site/

      - name: 토큰 상태 암호화 및 캐시 저장 준비
        env:
          CLAUDE_CREDENTIALS: ${{ secrets.CLAUDE_CREDENTIALS }}
        run: |
          rm -f state.enc
          if [ -f state.json ]; then
            export ENC_KEY="$(printf %s "$CLAUDE_CREDENTIALS" | sha256sum | awk '{print $1}')"
            openssl enc -aes-256-cbc -pbkdf2 -pass env:ENC_KEY -in state.json -out state.enc
            rm -f state.json
          fi

      - name: 토큰 상태 캐시 저장
        if: ${{ hashFiles('state.enc') != '' }}
        uses: actions/cache/save@v4
        with:
          path: state.enc
          key: token-state-${{ github.run_id }}

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
